<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <title>أيار — إدارة الصيدلية</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>

  <div class="app hidden">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <div class="brand-logo">أ</div>
        <div><b id="brand-name">أيار</b><small>إدارة الصيدلية</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="spacer"></div>
      <div id="user-box"></div>
      <div class="small muted center" id="sync-status"></div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <div class="row">
          <button class="btn icon ghost menu-btn" id="menu-btn" aria-label="القائمة"></button>
          <div>
            <h1 id="page-title">لوحة التحكم</h1>
            <div class="sub" id="page-sub"></div>
          </div>
        </div>
        <div class="row" id="top-actions"></div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div class="toast-wrap" id="toasts"></div>
  <div id="print-area"></div>

  <script src="js/barcode.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
