<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="أيار">
  <meta name="format-detection" content="telephone=no">
  <title>أيار — إدارة الصيدلية</title>
  <link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-blobs"><span></span><span></span><span></span></div>

  <div class="app hidden">
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="brand/logo-192.png" alt="شعار أيار" width="44" height="44">
        <div><b id="brand-name">أيار</b><small>إدارة الصيدلية</small></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="spacer"></div>
      <div id="user-box"></div>
      <div class="small muted center" id="sync-status"></div>
    </aside>

    <main class="main">
      <header class="topbar glass">
        <div class="row">
          <button class="btn icon ghost menu-btn" id="menu-btn" aria-label="القائمة"></button>
          <div>
            <h1 id="page-title">لوحة التحكم</h1>
            <div class="sub" id="page-sub"></div>
          </div>
        </div>
        <div class="row" id="top-actions"></div>
      </header>
      <section class="content" id="view"></section>
    </main>
  </div>

  <nav class="tabbar glass" id="tabbar"></nav>
  <div class="scrim" id="scrim"></div>
  <div id="modal-root"></div>
  <div class="toast-wrap" id="toasts"></div>
  <div id="print-area"></div>

  <script src="js/barcode.js"></script>
  <script src="js/db.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
